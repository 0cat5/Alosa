name: Alosa
version: "0.1.0"
slug: alosa
description: Control server for Alosa speakers, displays and audio devices
url: https://github.com/alosa-home/alosa
arch:
  - aarch64
  - amd64
# Host networking is required so devices can find the server via mDNS.
host_network: true
startup: services
# Lets the add-on announce itself (address + API token) to Home Assistant.
discovery:
  - alosa
options:
  auto_adopt: false
  log_level: info
schema:
  auto_adopt: bool
  log_level: list(trace|debug|info|warn|error)
# Prebuilt images, published by CI (not set up yet). Until then, build the image
# yourself (see the repository README).
# image: ghcr.io/alosa-home/{arch}-addon-alosa
