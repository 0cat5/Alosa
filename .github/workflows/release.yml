# Publishes a release when a version tag is pushed:
#
#   scripts/version.sh set 0.2.0     # and update CHANGELOG.md
#   git commit -am "Release 0.2.0" && git tag v0.2.0 && git push --follow-tags
#
# - GitHub release: device agent for every architecture, the integration zip,
#   release.env and SHA256SUMS (what `alosa-device install/update` downloads)
# - Add-on images: ghcr.io/<owner>/{amd64,aarch64}-addon-alosa:<version>
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: scripts/version.sh check "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/package.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # This version's section of the changelog becomes the release notes.
          awk -v v="$version" 'index($0, "## " v) == 1 { p = 1; next } /^## / { p = 0 } p' \
            CHANGELOG.md > notes.md
          prerelease=
          case $version in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Alosa $version" --notes-file notes.md $prerelease

  addon:
    name: Add-on image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          echo "version=$(scripts/version.sh check "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      # The Rust build cross-compiles natively; QEMU only runs the small
      # final stage (alpine's package install) for arm64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: addon/alosa/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/${{ matrix.arch }}-addon-alosa:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.version.outputs.owner }}/${{ matrix.arch }}-addon-alosa:latest
          labels: |
            io.hass.type=addon
            io.hass.name=Alosa
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
