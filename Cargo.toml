[workspace]
resolver = "2"
members = ["crates/alosa-protocol", "crates/alosa-server", "crates/alosa-agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/alosa-home/alosa"

[workspace.dependencies]
alosa-protocol = { path = "crates/alosa-protocol" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
getrandom = "0.4"
mdns-sd = "0.13"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
